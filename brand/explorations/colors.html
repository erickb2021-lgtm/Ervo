<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ervo band colors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; font-family: Manrope, system-ui, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    .picker { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(820px, calc(100% - 24px)); background: rgba(20, 16, 30, 0.9); backdrop-filter: blur(12px); color: #fff; border-radius: 20px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
    .now { display: flex; justify-content: space-between; font-size: 13px; color: #c9c2da; padding: 0 4px; }
    .now b { color: #fff; }
    .row { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
    .chip { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 999px; border: 2px solid transparent; background: rgba(255,255,255,.08); color: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
    .chip i { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
    .chip.on { border-color: #b79bf0; background: rgba(183,155,240,.18); }
  </style>
</head>
<body>
<iframe id="site" src="index.html" title="Ervo website preview"></iframe>

<div class="picker" role="group" aria-label="Band color">
  <div class="now"><span>Band color: <b id="name"></b> <span id="hex"></span></span><span>Scroll the page to see every band</span></div>
  <div class="row" id="chips"></div>
</div>

<script>
  // Colored bands that alternate with the off-white sections
  const options = [
    ["Peach (now)",  "#FFE6D9"],
    ["Lavender",     "#EFE7FC"],
    ["Lilac",        "#E6DAF8"],
    ["Mint",         "#DFF3EA"],
    ["Sky",          "#E2EDFB"],
    ["Butter",       "#FFF1C9"],
    ["Sage",         "#E4EDDD"],
    ["Blush",        "#FBE2EA"],
    ["Sand",         "#F1E5D3"],
    ["Stone",        "#EAE7E3"],
    // Darker, warmer options around sand
    ["Tan",          "#E8D5BA"],
    ["Latte",        "#DCC6A8"],
    ["Camel",        "#D2B48C"],
    ["Clay",         "#DDB9A3"],
    ["Taupe",        "#D3C6B6"],
    ["Mushroom",     "#C9BBAA"],
    // Darker cool options
    ["Dusty lilac",  "#D8CBEC"],
    ["Deep sage",    "#CCD8C0"],
    ["Slate blue",   "#CFDAE8"],
  ];

  const frame = document.getElementById("site");
  const chips = document.getElementById("chips");
  const buttons = [];
  let current = 0;

  // A slightly deeper shade of the band color for the blurred app tiles
  function deeper(hex) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v * 0.9));
    return `rgb(${c.join(",")})`;
  }

  function apply(i) {
    current = i;
    const [name, hex] = options[i];
    document.getElementById("name").textContent = name;
    document.getElementById("hex").textContent = hex;
    buttons.forEach((b, j) => b.classList.toggle("on", j === i));
    const doc = frame.contentDocument;
    if (!doc || !doc.documentElement) return;
    doc.documentElement.style.setProperty("--bg-alt", hex);
    let tag = doc.getElementById("picker-style");
    if (!tag) { tag = doc.createElement("style"); tag.id = "picker-style"; doc.head.append(tag); }
    tag.textContent = `.alt .app.fade { background: ${deeper(hex)} !important; }`;
  }

  options.forEach(([name, hex], i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.innerHTML = `<i style="background:${hex}"></i>`;
    b.append(name);
    b.addEventListener("click", () => apply(i));
    chips.append(b); buttons.push(b);
  });

  frame.addEventListener("load", () => apply(current));
  apply(0);
</script>
</body>
</html>
