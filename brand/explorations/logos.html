<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ervo icon ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Manrope, system-ui, sans-serif; background: #faf6f2; color: #1f1235; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.lead { margin: 0 0 20px; color: #6b5260; max-width: 700px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .card { background: #fff; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(42,22,80,.08); }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { height: 120px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .tile svg { width: 82px; height: 82px; }
    .light { background: #f5efe9; }
    .dark { background: #1f1235; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .foot b { font-size: 15px; }
    .app { width: 40px; height: 40px; background: #fff; border-radius: 22.5%; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 4px 12px rgba(31,18,53,.12); display: flex; align-items: center; justify-content: center; flex: none; }
    .app svg { width: 32px; height: 32px; }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="ears" d="M14 22 Q11 9 18 5 Q23 10 26 14 Z M50 22 Q53 9 46 5 Q41 10 38 14 Z" fill="#7B3FC4" stroke="#7B3FC4" stroke-width="2" stroke-linejoin="round"/>
    <path id="round" d="M32 10 C46 10 56 18 56 31 C56 44 46 51 33 51 L20 58 L22.5 48.5 C13 45 8 39 8 31 C8 18 18 10 32 10 Z" fill="#7B3FC4"/>
    <path id="square" d="M18 11 H46 Q56 11 56 21 V40 Q56 50 46 50 H31 L20 58 L22.5 50 H18 Q8 50 8 40 V21 Q8 11 18 11 Z" fill="#7B3FC4"/>
    <g id="face">
      <circle cx="24.5" cy="30" r="9.5" fill="#F1E7FF"/>
      <circle cx="39.5" cy="30" r="9.5" fill="#F1E7FF"/>
      <ellipse cx="32" cy="37" rx="12" ry="8.5" fill="#F1E7FF"/>
    </g>
    <path id="happy" d="M20.5 31 Q24.5 26 28.5 31 M35.5 31 Q39.5 26 43.5 31" fill="none" stroke="#1F1235" stroke-width="3" stroke-linecap="round"/>
    <g id="open">
      <circle cx="24.5" cy="30.5" r="4" fill="#1F1235"/><circle cx="39.5" cy="30.5" r="4" fill="#1F1235"/>
      <circle cx="25.9" cy="29.1" r="1.3" fill="#FFFFFF"/><circle cx="40.9" cy="29.1" r="1.3" fill="#FFFFFF"/>
    </g>
    <path id="beak" d="M29.8 36 Q32 34.8 34.2 36 L32 39.8 Z" fill="#F5A623" stroke="#F5A623" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- headset: color comes from --hs -->
    <path id="band" d="M12 31 Q12 12 32 12 Q52 12 52 31" fill="none" stroke="var(--hs)" stroke-width="3" stroke-linecap="round"/>
    <g id="cups">
      <rect x="6" y="25" width="8" height="13" rx="4" fill="var(--hs)"/><rect x="50" y="25" width="8" height="13" rx="4" fill="var(--hs)"/>
    </g>
    <g id="mic">
      <path d="M54 38 Q54 45 45 45.5" fill="none" stroke="var(--hs)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="43.5" cy="45.5" r="2.4" fill="var(--hs)"/>
    </g>
  </defs>

  <!-- 1. Open eyes -->
  <symbol id="i1" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/><use href="#open"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 2. Orange headset, matches the beak -->
  <symbol id="i2" viewBox="0 0 64 64" style="--hs:#F5A623">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/><use href="#happy"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 3. Light lavender headset, shows up on dark too -->
  <symbol id="i3" viewBox="0 0 64 64" style="--hs:#D9C8F5">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/><use href="#happy"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 4. Brows + headset -->
  <symbol id="i4" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/><use href="#open"/>
    <path d="M18.5 21.5 Q24 19 29 21.5 M35 21.5 Q40 19 45.5 21.5" fill="none" stroke="#4A2380" stroke-width="2.6" stroke-linecap="round"/>
    <use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 5. Square bubble -->
  <symbol id="i5" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#square"/><use href="#band"/><use href="#face"/><use href="#happy"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 6. Talking: sound waves by the mic -->
  <symbol id="i6" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/><use href="#happy"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
    <path d="M37.5 49.5 Q36 52 37.5 54.5 M33.5 48 Q31 52 33.5 56" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 7. Wink + headset -->
  <symbol id="i7" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#round"/><use href="#band"/><use href="#face"/>
    <path d="M20.5 31 Q24.5 26 28.5 31" fill="none" stroke="#1F1235" stroke-width="3" stroke-linecap="round"/>
    <circle cx="39.5" cy="30.5" r="4" fill="#1F1235"/><circle cx="40.9" cy="29.1" r="1.3" fill="#FFFFFF"/>
    <use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 8. Sleek one-ear headset -->
  <symbol id="i8" viewBox="0 0 64 64" style="--hs:#1F1235">
    <use href="#ears"/><use href="#round"/><use href="#face"/><use href="#happy"/><use href="#beak"/>
    <rect x="50" y="24" width="8" height="14" rx="4" fill="#1F1235"/>
    <path d="M54 38 Q53 46 42 46" fill="none" stroke="#1F1235" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="37.5" y="43.8" width="5.5" height="4.4" rx="2.2" fill="#1F1235"/>
  </symbol>

  <!-- 9. Two-tone cap + headset -->
  <symbol id="i9" viewBox="0 0 64 64" style="--hs:#F5A623">
    <path d="M14 22 Q11 9 18 5 Q23 10 26 14 Z M50 22 Q53 9 46 5 Q41 10 38 14 Z" fill="#4A2380" stroke="#4A2380" stroke-width="2" stroke-linejoin="round"/>
    <use href="#round"/>
    <path d="M10 22 C14 14 22 10 32 10 C42 10 50 14 54 22 Q32 16 10 22 Z" fill="#4A2380"/>
    <use href="#band"/><use href="#face"/><use href="#happy"/><use href="#beak"/><use href="#cups"/><use href="#mic"/>
  </symbol>

  <!-- 10. Detailed headset: padded cups and a band with an inner stripe -->
  <symbol id="i10" viewBox="0 0 64 64">
    <use href="#ears"/><use href="#round"/>
    <path d="M11.5 31 Q11.5 11.5 32 11.5 Q52.5 11.5 52.5 31" fill="none" stroke="#1F1235" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M11.5 31 Q11.5 11.5 32 11.5 Q52.5 11.5 52.5 31" fill="none" stroke="#7B3FC4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0 0"/>
    <use href="#face"/><use href="#happy"/><use href="#beak"/>
    <rect x="5" y="24" width="10" height="15" rx="5" fill="#1F1235"/><rect x="49" y="24" width="10" height="15" rx="5" fill="#1F1235"/>
    <rect x="7.5" y="27" width="5" height="9" rx="2.5" fill="#F5A623"/><rect x="51.5" y="27" width="5" height="9" rx="2.5" fill="#F5A623"/>
    <path d="M55 39 Q55 46 45.5 46.5" fill="none" stroke="#1F1235" stroke-width="2.4" stroke-linecap="round"/><circle cx="44" cy="46.5" r="2.6" fill="#1F1235"/>
  </symbol>
</svg>

<div class="wrap">
  <h1>Ervo icon ideas, round 8: headset owl</h1>
  <p class="lead">Ten versions of the headset owl you picked: different eyes, headset colors and headset styles. Each one is shown on light, on dark, and as a small app icon.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  const names = [
    "Open eyes", "Orange headset", "Lavender headset", "Brows", "Square bubble",
    "Talking", "Wink", "One-ear headset", "Two-tone + orange", "Padded headset",
  ];
  const grid = document.getElementById("grid");
  names.forEach((name, i) => {
    const use = `<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i${i + 1}"/></svg>`;
    grid.insertAdjacentHTML("beforeend", `
      <div class="card">
        <div class="pair"><div class="tile light">${use}</div><div class="tile dark">${use}</div></div>
        <div class="foot"><b>${i + 1} · ${name}</b><div class="app">${use}</div></div>
      </div>`);
  });
</script>
</body>
</html>
