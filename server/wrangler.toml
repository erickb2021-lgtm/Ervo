name = "ervo-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 20 messages a minute per phone, so nobody can run up the bill
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The API key is NOT here. Add it once with:  npx wrangler secret put ANTHROPIC_API_KEY
