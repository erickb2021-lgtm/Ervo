# Builds the Ervo Android app (APK) on GitHub's servers.
# - Every push that changes the app: the APK is attached to the workflow run.
# - Pushing a version tag like v0.1.0: the APK is published as a GitHub Release
#   so anyone can download it from the repo's Releases page.
name: Build Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "docs/app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ervo.apk

      - name: Check the app screens are inside the APK
        run: |
          unzip -l Ervo.apk | grep -E "assets/www/(index.html|app.js|app.css|img/ervo-classic.png)"
          test "$(unzip -l Ervo.apk | grep -cE 'assets/www/(index.html|app.js|app.css)$')" -eq 3

      - uses: actions/upload-artifact@v4
        with:
          name: Ervo-android
          path: Ervo.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ervo.apk
          body: |
            Ervo for Android (preview).
            Download **Ervo.apk** below and open it on your Android phone to install.
            You may need to allow installs from your browser or files app.
