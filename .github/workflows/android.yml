# Builds the Ervo Android app (APK) on GitHub's servers.
# - Every push that changes the app: the APK is attached to the workflow run.
# - Pushing a version tag like v0.2.1: the APK is published as a GitHub Release.
#   The app checks that release to offer in-app updates.
# The APK is signed with Ervo's own key (repo secrets ERVO_KEYSTORE_BASE64 and
# ERVO_KEYSTORE_PASSWORD). Phones only install an update signed with the same key.
name: Build Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "docs/app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of Ervo's signing certificate. Releases signed with anything else are refused.
  ERVO_CERT_SHA256: "2a693cc0b1064fb1a56cb7e2cf5cdd6e89253a8c96199c250e17c2c7f180ee34"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Add the signing key
        env:
          KEYSTORE: ${{ secrets.ERVO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/ervo-release.p12
          else
            echo "::warning::No signing key secret yet, so this build uses a temporary key and can't be installed as an update."
          fi

      - name: Build APK
        working-directory: android
        env:
          ERVO_KEYSTORE_PASSWORD: ${{ secrets.ERVO_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Ervo.apk
          rm -f android/app/ervo-release.p12

      - name: Check the app screens are inside the APK
        run: |
          unzip -l Ervo.apk | grep -E "assets/www/(index.html|app.js|app.css|img/ervo-classic.png)"
          test "$(unzip -l Ervo.apk | grep -cE 'assets/www/(index.html|app.js|app.css)$')" -eq 3

      - name: Check who signed the APK
        id: signer
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs Ervo.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Signed by certificate $SHA"
          if [ "$SHA" = "$ERVO_CERT_SHA256" ]; then echo "ervo=true" >> "$GITHUB_OUTPUT"; else echo "ervo=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ervo-android
          path: Ervo.apk

      - name: Stop a release that isn't signed with Ervo's key
        if: startsWith(github.ref, 'refs/tags/v') && steps.signer.outputs.ervo != 'true'
        run: |
          echo "::error::This APK isn't signed with Ervo's key, so phones couldn't update to it. Add the ERVO_KEYSTORE_BASE64 and ERVO_KEYSTORE_PASSWORD secrets, then push the tag again."
          exit 1

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "What's new in Ervo $(jq -r .version docs/app/version.json):"
            jq -r '.notes[] | "- " + .' docs/app/version.json
            echo
            echo "Already have Ervo 0.2.1 or newer? Open Ervo and tap **Update** when it asks."
            echo "New here? Download **Ervo.apk** below and open it on your Android phone to install."
          } > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ervo.apk
          body_path: release-notes.md
