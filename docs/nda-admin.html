<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tester Invites · Ervo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <script>try{var t=localStorage.getItem("ervo-theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
  <meta name="theme-color" content="#faf6f2">
  <link rel="icon" href="assets/ervo-symbol.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=23">
  <link rel="stylesheet" href="css/legal.css?v=5">
  <link rel="stylesheet" href="css/nda.css?v=2">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Ervo home"><img class="sym" src="assets/ervo-symbol.svg" alt="" data-dark="assets/ervo-symbol-white.svg"><img class="word" src="assets/ervo-wordmark.svg" alt="Ervo" data-dark="assets/ervo-wordmark-white.svg"></a>
    <div class="head-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  </div>
</header>

<main class="doc">
  <h1>Tester invites</h1>
  <p class="updated">Only you can use this page. Invite a tester, send them their link, and see who signed.</p>

  <form class="nda-state" id="key-form" autocomplete="off">
    <div class="admin-row">
      <div class="nf">
        <label for="key">Admin key</label>
        <input type="password" id="key" autocomplete="current-password">
        <p class="hint">The NDA_ADMIN_KEY you set on Ervo's server. It's kept only until you close this tab.</p>
      </div>
      <button class="btn btn-primary" type="submit">Open</button>
    </div>
    <p class="form-error" id="key-error" role="alert"></p>
  </form>

  <div id="panel" hidden>
    <form class="nda-state" id="invite-form" autocomplete="off">
      <h2>Invite a tester</h2>
      <div class="admin-row">
        <div class="nf">
          <label for="inv-email">Their email</label>
          <input type="email" id="inv-email" placeholder="name@example.com">
        </div>
        <button class="btn btn-primary" type="submit">Make invite link</button>
      </div>
      <p class="form-error" id="inv-error" role="alert"></p>
      <div id="inv-out" hidden></div>
    </form>

    <h2>Testers</h2>
    <p id="count" class="hint"></p>
    <table class="people">
      <thead><tr><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="people"></tbody>
    </table>
  </div>

  <dialog class="copy" id="copy">
    <div class="doc">
      <div class="actions no-print"><button class="btn btn-primary" type="button" id="copy-print">Save as PDF or print</button><button class="btn btn-ghost" type="button" id="copy-close">Close</button></div>
      <h1>Ervo Tester Confidentiality Agreement</h1>
      <p class="updated" id="copy-version"></p>
      <div class="nda-text" id="copy-text"></div>
      <div id="copy-block"></div>
    </div>
  </dialog>
</main>

<script src="js/theme.js?v=2"></script>
<script src="js/nda-text.js?v=1"></script>
<script src="js/nda-admin.js?v=1"></script>
</body>
</html>
