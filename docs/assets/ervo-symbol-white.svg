<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 65 58" role="img" aria-label="Ervo">
  <!-- ears + chat bubble body -->
  <path d="M14 22 Q11 9 18 5 Q23 10 26 14 Z M50 22 Q53 9 46 5 Q41 10 38 14 Z" fill="#7B3FC4" stroke="#7B3FC4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 10 C46 10 56 18 56 31 C56 44 46 51 33 51 L20 58 L22.5 48.5 C13 45 8 39 8 31 C8 18 18 10 32 10 Z" fill="#7B3FC4"/>
  <!-- padded headset band -->
  <path d="M11.5 31 Q11.5 11.5 32 11.5 Q52.5 11.5 52.5 31" fill="none" stroke="#EADCFB" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M11.5 31 Q11.5 11.5 32 11.5 Q52.5 11.5 52.5 31" fill="none" stroke="#7B3FC4" stroke-width="1.2" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="24.5" cy="30" r="9.5" fill="#F1E7FF"/>
  <circle cx="39.5" cy="30" r="9.5" fill="#F1E7FF"/>
  <ellipse cx="32" cy="37" rx="12" ry="8.5" fill="#F1E7FF"/>
  <!-- wink + open eye -->
  <path d="M20.5 31 Q24.5 26 28.5 31" fill="none" stroke="#1F1235" stroke-width="3" stroke-linecap="round"/>
  <circle cx="39.5" cy="30.5" r="4" fill="#1F1235"/>
  <circle cx="40.9" cy="29.1" r="1.3" fill="#FFFFFF"/>
  <!-- beak -->
  <path d="M29.8 36 Q32 34.8 34.2 36 L32 39.8 Z" fill="#F5A623" stroke="#F5A623" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- padded ear cups -->
  <rect x="5" y="24" width="10" height="15" rx="5" fill="#EADCFB"/>
  <rect x="49" y="24" width="10" height="15" rx="5" fill="#EADCFB"/>
  <rect x="7.5" y="27" width="5" height="9" rx="2.5" fill="#F5A623"/>
  <rect x="51.5" y="27" width="5" height="9" rx="2.5" fill="#F5A623"/>
  <!-- mic -->
  <path d="M55 39 Q55 46 45.5 46.5" fill="none" stroke="#EADCFB" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="44" cy="46.5" r="2.6" fill="#EADCFB"/>
  <!-- talking: sound waves -->
  <path d="M58.5 45 Q61 48.5 58.5 52 M62 42.5 Q65.5 48.5 62 54.5" fill="none" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round"/>
